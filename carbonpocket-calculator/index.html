<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1713" />
    <title>CarbonPocket | Footprint Calculator</title>
    <meta
      name="description"
      content="A calm, two-minute estimate of your carbon footprint. No blame, no perfect answers, just a place to begin."
    />
    <link rel="icon" type="image/png" href="./carbonpocket-app-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="./assets/index-8xHqDnEA.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-hQOtl3ms.css">
    <link rel="stylesheet" href="./calculator-overrides.css" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Configuracao do checkout de compensacao.
      const CHECKOUT_API = 'https://carbonpocketapp.vercel.app/api/checkout';
      const ANNUAL_ENABLED = true;
      const KG_MINIMO = 25;
      let paisSelecionado = 'nao_informado';
      const seletoresPaisRegistrados = new WeakSet();
      // Valores em dólar são referência comercial; em real são a cobrança efetiva. cambioReferencia define preços, sem conversão em tempo real.
      const PRECOS = {
        usdPorKgUnico: 0.02,
        usdPorKgAnual: 0.204,
        brlPorKgUnico: 0.11,
        brlPorKgMensal: 0.11,
        brlPorKgAnual: 1.12,
        cambioReferencia: 5.60,
        notaCambio: 'USD values are approximate references. You will be charged in BRL.',
      };

      function quantidadeKg(emissoesKg) {
        return Math.max(KG_MINIMO, Math.round(Number(emissoesKg) || 0));
      }

      function calcularValores(emissoesKg) {
        const kg = quantidadeKg(emissoesKg);
        return {
          kg: kg.toFixed(0),
          unicoUsd: (kg * PRECOS.usdPorKgUnico).toFixed(2),
          mensalUsd: (kg * PRECOS.usdPorKgUnico).toFixed(2),
          anualUsd: (kg * PRECOS.usdPorKgAnual).toFixed(2),
          unicoBrl: formatarBRL(kg * PRECOS.brlPorKgUnico),
          mensalBrl: formatarBRL(kg * PRECOS.brlPorKgMensal),
          anualBrl: formatarBRL(kg * PRECOS.brlPorKgAnual),
        };
      }

      function formatarBRL(valor) {
        return 'R$ ' + valor.toLocaleString('pt-BR', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        });
      }

      function exibirValor(emissoesKg) {
        const valores = calcularValores(emissoesKg);
        let resumo = document.getElementById('resumo-valor');
        let cobrancaBRL = document.getElementById('resumo-cobranca-brl');
        let notaCambio = document.getElementById('resumo-nota-cambio');

        if (!resumo) {
          resumo = document.createElement('p');
          resumo.id = 'resumo-valor';
          resumo.className = 'checkout-resumo';
          const ancoraResultado = document.getElementById('result-panel-anchor');
          (ancoraResultado || document.getElementById('root')).appendChild(resumo);
        }

        const textoResumo =
          `Compensation for X kg: US$ Y once, US$ Z/month or US$ W/year`
            .replace('X', valores.kg)
            .replace('Y', valores.unicoUsd)
            .replace('Z', valores.mensalUsd)
            .replace('W', valores.anualUsd);
        if (resumo.textContent !== textoResumo) {
          resumo.textContent = textoResumo;
        }

        if (!cobrancaBRL) {
          cobrancaBRL = document.createElement('p');
          cobrancaBRL.id = 'resumo-cobranca-brl';
          cobrancaBRL.className = 'checkout-resumo-brl';
          resumo.insertAdjacentElement('afterend', cobrancaBRL);
        }
        const textoCobrancaBRL =
          `Charged in BRL: ${valores.unicoBrl} once, ${valores.mensalBrl}/month or ${valores.anualBrl}/year`;
        if (cobrancaBRL.textContent !== textoCobrancaBRL) {
          cobrancaBRL.textContent = textoCobrancaBRL;
        }

        if (!notaCambio) {
          notaCambio = document.createElement('p');
          notaCambio.id = 'resumo-nota-cambio';
          notaCambio.className = 'checkout-nota-cambio';
          cobrancaBRL.insertAdjacentElement('afterend', notaCambio);
        }
        if (notaCambio.textContent !== PRECOS.notaCambio) {
          notaCambio.textContent = PRECOS.notaCambio;
        }

        if (notaCambio.previousElementSibling !== cobrancaBRL) {
          cobrancaBRL.insertAdjacentElement('afterend', notaCambio);
        }
      }

      async function irParaCheckout(categoria, emissoesKg, nome, email) {
        if (!email) {
          throw new Error('Email is required');
        }

        const resposta = await fetch(CHECKOUT_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            categoria,
            emissaoKg: quantidadeKg(emissoesKg),
            nome,
            email,
            pais: paisSelecionado,
          }),
        });

        if (!resposta.ok) {
          throw new Error('Unexpected checkout response');
        }

        const dados = await resposta.json();
        if (!dados.url) {
          throw new Error('Checkout URL missing');
        }
        window.location.href = dados.url;
      }

      function criarPainelCheckout() {
        const existente = document.getElementById('checkout-compensacao');

        const ancoraResultado = document.getElementById('result-panel-anchor');
        if (!ancoraResultado) return;

        const painelReduzir = document.querySelector('[data-testid="panel-recommendations"]');
        const destino = painelReduzir || ancoraResultado;

        if (existente) {
          if (existente.parentElement !== destino) {
            destino.appendChild(existente);
          }
          criarLinkContribuidores(destino, existente);
          ancoraResultado.classList.toggle('checkout-visible', !painelReduzir);
          return;
        }

        const painel = document.createElement('section');
        painel.id = 'checkout-compensacao';
        painel.className = 'checkout-compensacao';
        painel.innerHTML = `
          <p class="checkout-titulo">Compensate your footprint</p>
          <a class="checkout-parceiro-cabecalho" href="https://brcarbon.com.br/" target="_blank" rel="noopener noreferrer">
            <div class="checkout-parceiro-logo" aria-hidden="true">BR</div>
            <div>
              <p class="checkout-parceiro-nome">Partner: Brcarbon</p>
              <p class="checkout-parceiro-site">brcarbon.com.br</p>
            </div>
          </a>
          <div class="checkout-campos">
            <input id="nome" type="text" placeholder="Contributor name">
            <input id="email" type="email" placeholder="you@email.com">
          </div>
          <p id="resumo-valor" class="checkout-resumo"></p>
          <p class="checkout-transparencia">Your name will be listed publicly among our contributors.</p>
          <aside class="checkout-parceiro" aria-label="Partner information">
            <p>Credits are sourced from REDD+ forest protection projects in the Brazilian
            Amazon with Verra Standard certification. Your offsets support local
            communities while protecting the world's most vital ecosystem.</p>
            <p>Link: <a href="https://brcarbon.com.br/" target="_blank" rel="noopener noreferrer">https://brcarbon.com.br/</a></p>
            <!-- TODO: incluir o registro Verra quando o numero for fornecido. -->
          </aside>
          <div class="checkout-acoes">
            <button type="button" class="button button-primary" data-categoria="unico">Compensate once</button>
            <button type="button" class="button button-primary" data-categoria="mensal">Monthly subscription</button>
            ${ANNUAL_ENABLED ? '<button type="button" class="button button-primary" data-categoria="anual">Annual subscription - 15% off</button>' : ''}
          </div>
        `;

        destino.appendChild(painel);
        criarLinkContribuidores(destino, painel);
        ancoraResultado.classList.toggle('checkout-visible', !painelReduzir);
        painel.querySelectorAll('[data-categoria]').forEach((botao) => {
          botao.addEventListener('click', async () => {
            const emissaoKg = obterEmissaoAtual();
            const nome = painel.querySelector('#nome').value.trim();
            const email = painel.querySelector('#email').value.trim();
            let mensagemErro = painel.querySelector('.checkout-erro');

            if (!mensagemErro) {
              mensagemErro = document.createElement('p');
              mensagemErro.className = 'checkout-erro';
              mensagemErro.setAttribute('role', 'alert');
              painel.appendChild(mensagemErro);
            }

            mensagemErro.textContent = '';
            botao.disabled = true;

            try {
              await irParaCheckout(botao.dataset.categoria, emissaoKg, nome, email);
            } catch (erro) {
              botao.disabled = false;
              mensagemErro.textContent = 'We could not start your payment. Please try again.';
            }
          });
        });
      }

      function criarLinkContribuidores(destino, painel) {
        let bloco = document.getElementById('calculator-contributors-featured');
        if (!bloco) {
          bloco = document.createElement('p');
          bloco.id = 'calculator-contributors-featured';
          bloco.className = 'contributors-featured-link';
          const link = document.createElement('a');
          link.href = 'https://carbonpocket.app/carbonpocket-calculator/contributors.html';
          link.textContent = 'See the credits compensated by all users';
          bloco.appendChild(link);
        }

        if (painel.parentElement !== destino) {
          destino.appendChild(painel);
        }
        if (bloco.previousElementSibling !== painel) {
          painel.insertAdjacentElement('afterend', bloco);
        }
      }

      function atualizarConteudoPagina() {
        document.querySelectorAll('[data-testid="panel-recommendations"] .recommendation-footer > span').forEach((texto) => {
          if (texto.textContent.trim() === 'Your estimate is a starting point, not a judgment.') {
            texto.remove();
          }
        });

        document.querySelectorAll('footer p').forEach((paragrafo) => {
          if (paragrafo.textContent.trim() === 'Estimates are educational, not a measure of personal worth.') {
            paragrafo.textContent = 'Calculations are an estimate to serve as a way to support carbon projects.';
            // TODO: corrigir idealmente o texto na fonte React.
          }
        });

        if (!document.getElementById('neutralization-service-link') && document.querySelector('footer')) {
          const rodape = document.querySelector('footer');
          const bloco = document.createElement('div');
          bloco.id = 'neutralization-service-link';
          bloco.className = 'neutralization-service-link';
          const link = document.createElement('a');
          link.href = 'https://carbonpocket.app/neutralization-service/neutralization-service';
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = 'Learn about our neutralization service';
          // TODO em portugues: confirmar se esta URL esta correta (o segmento aparece duplicado no caminho).
          bloco.appendChild(link);
          rodape.parentNode.insertBefore(bloco, rodape);
        }

        if (!document.getElementById('calculator-contributors-link') && document.querySelector('footer')) {
          const rodape = document.querySelector('footer');
          const bloco = document.createElement('div');
          bloco.id = 'calculator-contributors-link';
          bloco.className = 'neutralization-service-link';
          const link = document.createElement('a');
          link.href = 'https://carbonpocket.app/carbonpocket-calculator/contributors.html';
          link.textContent = 'View contributors';
          bloco.appendChild(link);
          rodape.parentNode.insertBefore(bloco, rodape);
        }
      }

      function obterEmissaoAtual() {
        const elemento = document.querySelector('[data-testid="text-total"]');
        if (!elemento) return 0;
        return Number(String(elemento.textContent).replace(/[^\d.-]/g, '')) || 0;
      }

      function registrarPaisSelecionado() {
        const seletor = document.querySelector('[data-testid="select-country"]');
        if (!seletor) return;
        paisSelecionado = seletor.value;
        if (seletoresPaisRegistrados.has(seletor)) return;

        seletoresPaisRegistrados.add(seletor);
        seletor.addEventListener('change', () => {
          paisSelecionado = seletor.value;
        });
      }

      function atualizarCheckout() {
        registrarPaisSelecionado();
        const emissaoKg = obterEmissaoAtual();
        if (document.querySelector('[data-testid="text-total"]')) {
          criarPainelCheckout();
          exibirValor(emissaoKg);
        }
        atualizarConteudoPagina();
      }

      // Observa o resultado produzido pela calculadora React sem alterar seu calculo.
      const raizCalculadora = document.getElementById('root');
      const observadorCalculadora = new MutationObserver(() => {
        observadorCalculadora.disconnect();
        try {
          atualizarCheckout();
        } finally {
          observadorCalculadora.observe(raizCalculadora, {
            childList: true,
            characterData: true,
            subtree: true,
          });
        }
      });
      observadorCalculadora.observe(raizCalculadora, {
        childList: true,
        characterData: true,
        subtree: true,
      });
      atualizarCheckout();
    </script>
  </body>
</html>
