<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1713" />
    <title>CarbonPocket | Footprint Calculator</title>
    <meta
      name="description"
      content="A calm, two-minute estimate of your carbon footprint. No blame, no perfect answers, just a place to begin."
    />
    <link rel="icon" type="image/png" href="./carbonpocket-app-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="./assets/index-8xHqDnEA.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-hQOtl3ms.css">
    <link rel="stylesheet" href="./calculator-overrides.css" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Configuracao do checkout de compensacao.
      const CHECKOUT_API = 'https://carbonpocketapp.vercel.app/api/checkout';
      const ANNUAL_ENABLED = true;
      // TODO: replace these explicit placeholders with verified cycle data before publishing.
      const COMPENSATION_CONFIG = {
        projectName: '[PROJECT_NAME]',
        projectId: '[PROJECT_ID]',
        methodologyId: '[METHODOLOGY_ID]',
        vintageRange: '[VINTAGE_RANGE]',
        retirementTransactionId: '[RETIREMENT_TX_ID]',
        serialStart: '[SERIAL_START]',
        serialEnd: '[SERIAL_END]',
        retirementDate: '[DATE]',
        beneficiaryCycle: '[YYYY-MM]',
        ledgerUrl: '[LEDGER_URL]',
      };
      const KG_MINIMO = 25;
      const CREDITOS_KG_MINIMO = 100;
      const CREDITOS_KG_MAXIMO = 10000;
      const CREDITOS_KG_PASSO = 100;
      const PRECO_BR_AVULSO_POR_KG = 0.11;
      let paisSelecionado = 'nao_informado';
      const seletoresPaisRegistrados = new WeakSet();
      // Valores em dólar são referência comercial; em real são a cobrança efetiva. cambioReferencia define preços, sem conversão em tempo real.
      const PRECOS = {
        usdPorKgUnico: 0.02,
        usdPorKgAnual: 0.204,
        cambioReferencia: 5.60,
        notaCambio: 'USD values are approximate references. You will be charged in BRL.',
      };

      function quantidadeKg(emissoesKg) {
        return Math.max(KG_MINIMO, Math.round(Number(emissoesKg) || 0));
      }

      function formatarBRL(valorReais) {
        return 'R$ ' + valorReais.toLocaleString('pt-BR', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        });
      }

      function formatarKg(valorKg) {
        return Number(valorKg).toLocaleString('pt-BR');
      }

      function calcularValores(emissoesKg) {
        const kg = quantidadeKg(emissoesKg);
        return {
          kg: kg.toFixed(0),
          unicoUsd: (kg * PRECOS.usdPorKgUnico).toFixed(2),
          mensalUsd: (kg * PRECOS.usdPorKgUnico).toFixed(2),
          anualUsd: (kg * PRECOS.usdPorKgAnual).toFixed(2),
        };
      }

      let camposCheckout;

      function obterCamposCheckout() {
        if (!camposCheckout) {
          camposCheckout = document.createElement('div');
          camposCheckout.className = 'checkout-campos';
          camposCheckout.innerHTML = `
            <input id="nome" type="text" placeholder="Contributor name (optional)" aria-label="Contributor name (optional)">
            <input id="email" type="email" placeholder="you@email.com">
          `;
        }
        return camposCheckout;
      }

      function moverCamposCheckoutParaPainel(painel) {
        const campos = obterCamposCheckout();
        const camposDestino = painel.querySelector('#checkout-campos-slot');
        if (camposDestino) camposDestino.replaceWith(campos);
      }

      function exibirValor(emissoesKg) {
        const valores = calcularValores(emissoesKg);
        let resumo = document.getElementById('resumo-valor');
        let notaCambio = document.getElementById('resumo-nota-cambio');

        if (!resumo) {
          resumo = document.createElement('p');
          resumo.id = 'resumo-valor';
          resumo.className = 'checkout-resumo';
          const ancoraResultado = document.getElementById('result-panel-anchor');
          (ancoraResultado || document.getElementById('root')).appendChild(resumo);
        }

        const textoResumo =
          `Compensation for X kg: US$ Y once, US$ Z/month or US$ W/year`
            .replace('X', valores.kg)
            .replace('Y', valores.unicoUsd)
            .replace('Z', valores.mensalUsd)
            .replace('W', valores.anualUsd);
        if (resumo.textContent !== textoResumo) {
          resumo.textContent = textoResumo;
        }
        atualizarAvisoQualificacao(
          document.getElementById('checkout-compensacao'),
          emissoesKg,
          false,
        );

        if (!notaCambio) {
          notaCambio = document.createElement('p');
          notaCambio.id = 'resumo-nota-cambio';
          notaCambio.className = 'checkout-nota-cambio';
          resumo.insertAdjacentElement('afterend', notaCambio);
        }
        if (notaCambio.textContent !== PRECOS.notaCambio) {
          notaCambio.textContent = PRECOS.notaCambio;
        }

        if (notaCambio.previousElementSibling !== resumo) {
          resumo.insertAdjacentElement('afterend', notaCambio);
        }
      }

      async function irParaCheckout(categoria, emissoesKg, nome, email) {
        if (!email) {
          throw new Error('Email is required');
        }

        const resposta = await fetch(CHECKOUT_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            categoria,
            emissaoKg: quantidadeKg(emissoesKg),
            nome,
            email,
            pais: paisSelecionado,
          }),
        });

        if (!resposta.ok) {
          const erro = new Error('Unexpected checkout response');
          erro.status = resposta.status;
          throw erro;
        }

        const dados = await resposta.json();
        if (!dados.url) {
          throw new Error('Checkout URL missing');
        }
        window.location.href = dados.url;
      }

      function criarPainelCheckout() {
        const existente = document.getElementById('checkout-compensacao');

        const ancoraResultado = document.getElementById('result-panel-anchor');
        if (!ancoraResultado) return;

        const painelReduzir = document.querySelector('[data-testid="panel-recommendations"]');
        const destino = painelReduzir || ancoraResultado;

        if (existente) {
          moverCamposCheckoutParaPainel(existente);
          atualizarAvisoQualificacao(existente, obterEmissaoAtual(), false);
          if (existente.parentElement !== destino) {
            destino.appendChild(existente);
          }
          ancoraResultado.classList.toggle('checkout-visible', !painelReduzir);
          criarSeccaoCreditosAvulsos(destino, existente);
          return;
        }

        const painel = document.createElement('section');
        painel.id = 'checkout-compensacao';
        painel.className = 'checkout-compensacao';
        painel.innerHTML = `
          <p class="checkout-titulo">Buy carbon compensation</p>
          <a class="checkout-parceiro-cabecalho" href="https://brcarbon.com.br/" target="_blank" rel="noopener noreferrer">
            <div class="checkout-parceiro-logo" aria-hidden="true">BR</div>
            <div>
              <p class="checkout-parceiro-nome" data-supplier-name>Credit supplier: BR Carbon</p>
              <p class="checkout-parceiro-site" data-supplier-standard>Verra VCS identifies the credit certification standard, not app approval.</p>
            </div>
          </a>
          <div id="checkout-campos-slot"></div>
          <p id="resumo-valor" class="checkout-resumo"></p>
          <aside class="qualification-notice" aria-live="polite">
            <h3 data-qualification-title>What you are buying</h3>
            <p data-qualification-body></p>
            <details>
              <summary data-verification-summary>How your compensation is verified</summary>
              <ul data-verification-list></ul>
            </details>
          </aside>
          <aside class="checkout-parceiro" aria-label="Partner information">
            <h3 data-partner-title>Verified credits, fully disclosed</h3>
            <p data-partner-cycle>Verra VCS-certified REDD+ credits. Cycle details will be published after verification: project ${COMPENSATION_CONFIG.projectName}, serial range ${COMPENSATION_CONFIG.serialStart}–${COMPENSATION_CONFIG.serialEnd}, retirement ID ${COMPENSATION_CONFIG.retirementTransactionId}, ledger ${COMPENSATION_CONFIG.ledgerUrl}. Carbon Pocket is not certified or endorsed by Verra.</p>
            <p data-partner-cobenefits>Co-benefit information is that published by the project developer.</p>
            <p data-partner-roles>Verra is the certification standard for the credits. BR Carbon is the credit supplier.</p>
            <p><span data-partner-link-label>Link:</span> <a href="https://brcarbon.com.br/" target="_blank" rel="noopener noreferrer">https://brcarbon.com.br/</a></p>
          </aside>
          <div class="checkout-acoes">
            <button type="button" class="button button-primary" data-categoria="unico">Compensate once</button>
            <button type="button" class="button button-primary" data-categoria="mensal">Monthly subscription</button>
            ${ANNUAL_ENABLED ? '<button type="button" class="button button-primary" data-categoria="anual">Annual subscription - 15% off</button>' : ''}
          </div>
        `;

        painel.querySelectorAll('[data-categoria]').forEach((botao) => {
          const reforco = document.createElement('p');
          reforco.className = 'qualification-reinforcement';
          reforco.textContent = 'Compensation only, your emissions still occur. Credits are retired in a public registry.';
          botao.insertAdjacentElement('afterend', reforco);
        });
        atualizarAvisoQualificacao(painel, obterEmissaoAtual(), false);
        moverCamposCheckoutParaPainel(painel);
        destino.appendChild(painel);
        ancoraResultado.classList.toggle('checkout-visible', !painelReduzir);
        criarSeccaoCreditosAvulsos(destino, painel);
        painel.querySelectorAll('[data-categoria]').forEach((botao) => {
          botao.addEventListener('click', async () => {
            const emissaoKg = obterEmissaoAtual();
            const nome = painel.querySelector('#nome').value.trim();
            const email = painel.querySelector('#email').value.trim();
            let mensagemErro = painel.querySelector('.checkout-erro');

            if (!mensagemErro) {
              mensagemErro = document.createElement('p');
              mensagemErro.className = 'checkout-erro';
              mensagemErro.setAttribute('role', 'alert');
              painel.appendChild(mensagemErro);
            }

            mensagemErro.textContent = '';
            botao.disabled = true;

            try {
              await irParaCheckout(botao.dataset.categoria, emissaoKg, nome, email);
            } catch (erro) {
              botao.disabled = false;
              mensagemErro.textContent = 'We could not start your payment. Please try again.';
            }
          });
        });
      }

      function criarSeccaoCreditosAvulsos(destino, painelCheckout) {
        let secao = document.getElementById('creditos-avulsos');
        if (secao) {
          if (painelCheckout) {
            if (secao.parentElement !== destino || secao.previousElementSibling !== painelCheckout) {
              painelCheckout.insertAdjacentElement('afterend', secao);
            }
          } else {
            const rodape = document.querySelector('footer');
            if (rodape && secao.nextElementSibling !== rodape) {
              rodape.insertAdjacentElement('beforebegin', secao);
            } else if (!rodape && secao.parentElement !== destino) {
              destino.appendChild(secao);
            }
          }
          atualizarAvisoQualificacao(
            secao,
            Number(secao.querySelector('#campo-kg').value) || 500,
            true,
          );
          return;
        }

        if (!destino) return;

        secao = document.createElement('section');
        secao.id = 'creditos-avulsos';
        secao.className = 'creditos-avulsos';
        secao.innerHTML = `
          <h3>Buy carbon compensation</h3>
          <p>Compensate a set volume without calculating your footprint.</p>
          <div class="creditos-selecao">
            <div class="creditos-kg">
              <span>Credits selected</span>
              <output id="creditos-kg-selecionados" aria-live="polite">500 kg</output>
            </div>
            <label class="creditos-campo">
              Exact amount (kg)
              <input id="campo-kg" type="number" min="100" max="10000" step="100" value="500" inputmode="numeric">
            </label>
          </div>
          <input id="slider-kg" type="range" min="100" max="10000" step="100" value="500" aria-label="Credit amount in kilograms">
          <div class="creditos-preco">
            <strong id="creditos-preco-brl">R$ 55,00</strong>
            <span id="creditos-preco-usd">(approx. US$ 9.82)</span>
          </div>
          <div class="creditos-presets" role="group" aria-label="Quick credit amounts">
            <button type="button" data-credit-kg="500">500 kg</button>
            <button type="button" data-credit-kg="1000">1,000 kg</button>
            <button type="button" data-credit-kg="5000">5,000 kg</button>
          </div>
          <aside class="qualification-notice" aria-live="polite">
            <h3 data-qualification-title>What you are buying</h3>
            <p data-qualification-body></p>
            <details>
              <summary data-verification-summary>How your compensation is verified</summary>
              <ul data-verification-list></ul>
            </details>
          </aside>
          <button type="button" class="creditos-comprar">Buy carbon compensation</button>
          <p class="qualification-reinforcement">Compensation only, your emissions still occur. Credits are retired in a public registry.</p>
          <p class="creditos-erro" role="alert"></p>
        `;

        if (!painelCheckout) {
          const campos = obterCamposCheckout();
          const primeiroControle = secao.querySelector('.creditos-selecao');
          secao.insertBefore(campos, primeiroControle);
        }

        if (painelCheckout) {
          painelCheckout.insertAdjacentElement('afterend', secao);
        } else {
          const rodape = document.querySelector('footer');
          if (rodape) {
            rodape.insertAdjacentElement('beforebegin', secao);
          } else {
            destino.appendChild(secao);
          }
        }

        const slider = secao.querySelector('#slider-kg');
        const campo = secao.querySelector('#campo-kg');
        const displayKg = secao.querySelector('#creditos-kg-selecionados');
        const displayBRL = secao.querySelector('#creditos-preco-brl');
        const displayUSD = secao.querySelector('#creditos-preco-usd');
        let ultimoValorValido = 500;

        atualizarAvisoQualificacao(secao, ultimoValorValido, true);

        function exibirCreditos(valorKg) {
          const centavos = valorKg * PRECO_BR_AVULSO_POR_KG * 100;
          const valorReais = centavos / 100;
          displayKg.textContent = `${formatarKg(valorKg)} kg`;
          displayBRL.textContent = formatarBRL(valorReais);
          displayUSD.textContent =
            `(approx. US$ ${(valorReais / PRECOS.cambioReferencia).toFixed(2)})`;
          atualizarAvisoQualificacao(secao, valorKg, true);
        }

        slider.addEventListener('input', () => {
          ultimoValorValido = Number(slider.value);
          campo.value = String(ultimoValorValido);
          exibirCreditos(ultimoValorValido);
        });

        campo.addEventListener('input', () => {
          if (campo.value === '') return;
          const valorDigitado = Number(campo.value);
          if (!Number.isFinite(valorDigitado)) return;
          const arredondado = Math.round(valorDigitado / CREDITOS_KG_PASSO) * CREDITOS_KG_PASSO;
          ultimoValorValido = Math.min(
            CREDITOS_KG_MAXIMO,
            Math.max(CREDITOS_KG_MINIMO, arredondado),
          );
          slider.value = String(ultimoValorValido);
          exibirCreditos(ultimoValorValido);
        });

        campo.addEventListener('blur', () => {
          const valorDigitado = Number(campo.value);
          if (campo.value === '' || !Number.isFinite(valorDigitado)) {
            campo.value = String(ultimoValorValido);
          } else {
            const arredondado = Math.round(valorDigitado / CREDITOS_KG_PASSO) * CREDITOS_KG_PASSO;
            ultimoValorValido = Math.min(
              CREDITOS_KG_MAXIMO,
              Math.max(CREDITOS_KG_MINIMO, arredondado),
            );
            campo.value = String(ultimoValorValido);
          }
          slider.value = String(ultimoValorValido);
          exibirCreditos(ultimoValorValido);
        });

        secao.querySelectorAll('[data-credit-kg]').forEach((botao) => {
          botao.addEventListener('click', () => {
            ultimoValorValido = Number(botao.dataset.creditKg);
            slider.value = String(ultimoValorValido);
            campo.value = String(ultimoValorValido);
            exibirCreditos(ultimoValorValido);
          });
        });

        secao.querySelector('.creditos-comprar').addEventListener('click', async (evento) => {
          const botao = evento.currentTarget;
          const mensagemErro = secao.querySelector('.creditos-erro');
          const nome = document.getElementById('nome').value.trim();
          const email = document.getElementById('email').value.trim();

          mensagemErro.textContent = '';
          botao.disabled = true;
          botao.textContent = 'Redirecting...';

          try {
            await irParaCheckout('avulso', ultimoValorValido, nome, email);
          } catch (erro) {
            botao.disabled = false;
            botao.textContent = 'Buy carbon compensation';
            if (erro.status === 400) {
              mensagemErro.textContent =
                'Unable to start checkout. Please check the amount and try again.';
            } else if (erro.message === 'Email is required') {
              mensagemErro.textContent = 'Please enter your email address.';
            } else {
              mensagemErro.textContent = 'Unable to start checkout right now.';
            }
          }
        });

        exibirCreditos(ultimoValorValido);
      }

      function atualizarConteudoPagina() {
        document.querySelectorAll('[data-testid="panel-recommendations"] .recommendation-footer > span').forEach((texto) => {
          if (texto.textContent.trim() === 'Your estimate is a starting point, not a judgment.') {
            texto.remove();
          }
        });

        document.querySelectorAll('footer p').forEach((paragrafo) => {
          if (paragrafo.textContent.trim() === 'Estimates are educational, not a measure of personal worth.') {
            paragrafo.textContent = 'Calculations are estimates of your emissions based on published factors. A purchase compensates an equivalent volume of tCO2e with credits retired in a public registry. Your calculation is not an official inventory.';
          }
        });

        const rodape = document.querySelector('footer');
        if (rodape && !document.getElementById('calculator-footer-links')) {
          const bloco = document.createElement('p');
          bloco.id = 'calculator-footer-links';
          bloco.className = 'calculator-footer-links';
          const contribuidores = document.createElement('a');
          contribuidores.href = 'https://carbonpocket.app/carbonpocket-calculator/contributors/';
          contribuidores.textContent = 'View contributors';
          const servico = document.createElement('a');
          servico.href = 'https://carbonpocket.app/compensation-service/';
          servico.target = '_blank';
          servico.rel = 'noopener noreferrer';
          servico.textContent = 'Learn about carbon compensation';
          bloco.append(contribuidores, document.createTextNode(' · '), servico);
          rodape.appendChild(bloco);
        }
      }

      function atualizarAvisoQualificacao(container, quantidadeKg, volumeDefinido) {
        if (!container) return;
        const aviso = container.querySelector('.qualification-notice');
        if (!aviso) return;
        const emPortugues = paisSelecionado === 'BR';
        const quantidade = formatarKg(quantidadeKg);
        container.querySelectorAll('.qualification-reinforcement').forEach((linha) => {
          linha.textContent = emPortugues
            ? 'Apenas compensação: suas emissões continuam ocorrendo. Os créditos são aposentados em registro público.'
            : 'Compensation only, your emissions still occur. Credits are retired in a public registry.';
        });
        aviso.querySelector('[data-qualification-title]').textContent = emPortugues
          ? 'O que você está comprando'
          : 'What you are buying';
        aviso.querySelector('[data-qualification-body]').textContent = emPortugues
          ? volumeDefinido
            ? `Isto compensa ${quantidade} kg CO2e com créditos REDD+ certificados pelo padrão Verra VCS. É compensação, não redução: suas emissões continuam ocorrendo. Os créditos são aposentados em lotes, publicados a cada ciclo em ${COMPENSATION_CONFIG.ledgerUrl}. Não é inventário oficial, não é CRVE e não serve para cumprir obrigações do SBCE nem metas de NDC.`
            : `Isto compensa ${quantidade} kg CO2e da sua pegada mensal estimada com créditos REDD+ certificados pelo padrão Verra VCS. É compensação, não redução: suas emissões continuam ocorrendo. Os créditos são aposentados em lotes, publicados a cada ciclo em ${COMPENSATION_CONFIG.ledgerUrl}. Não é inventário oficial, não é CRVE e não serve para cumprir obrigações do SBCE nem metas de NDC.`
          : volumeDefinido
            ? `This compensates ${quantidade} kg CO2e with Verra VCS-certified REDD+ credits. Compensation, not reduction: your emissions still occur. Credits are retired in pooled retirements, published each cycle at ${COMPENSATION_CONFIG.ledgerUrl}. Not an official inventory, not a CRVE, and not valid for SBCE compliance or NDC claims.`
            : `This compensates ${quantidade} kg CO2e of your estimated monthly footprint with Verra VCS-certified REDD+ credits. Compensation, not reduction: your emissions still occur. Credits are retired in pooled retirements, published each cycle at ${COMPENSATION_CONFIG.ledgerUrl}. Not an official inventory, not a CRVE, and not valid for SBCE compliance or NDC claims.`;

        aviso.querySelector('[data-verification-summary]').textContent = emPortugues
          ? 'Como sua compensação é verificada'
          : 'How your compensation is verified';
        const painelParceiro = container.querySelector('.checkout-parceiro');
        if (painelParceiro) {
          painelParceiro.setAttribute(
            'aria-label',
            emPortugues ? 'Informações sobre parceiros' : 'Partner information',
          );
          container.querySelector('[data-supplier-name]').textContent = emPortugues
            ? 'Fornecedor de créditos: BR Carbon'
            : 'Credit supplier: BR Carbon';
          container.querySelector('[data-supplier-standard]').textContent = emPortugues
            ? 'Verra VCS identifica o padrão de certificação dos créditos, não uma aprovação do aplicativo.'
            : 'Verra VCS identifies the credit certification standard, not app approval.';
          painelParceiro.querySelector('[data-partner-title]').textContent = emPortugues
            ? 'Créditos verificados, com divulgação completa'
            : 'Verified credits, fully disclosed';
          painelParceiro.querySelector('[data-partner-cycle]').textContent = emPortugues
            ? `Créditos REDD+ certificados pela Verra VCS. Detalhes do ciclo serão publicados após verificação: projeto ${COMPENSATION_CONFIG.projectName}, faixa de séries ${COMPENSATION_CONFIG.serialStart}–${COMPENSATION_CONFIG.serialEnd}, ID de aposentadoria ${COMPENSATION_CONFIG.retirementTransactionId}, registro ${COMPENSATION_CONFIG.ledgerUrl}. Carbon Pocket não é certificado nem endossado pela Verra.`
            : `Verra VCS-certified REDD+ credits. Cycle details will be published after verification: project ${COMPENSATION_CONFIG.projectName}, serial range ${COMPENSATION_CONFIG.serialStart}–${COMPENSATION_CONFIG.serialEnd}, retirement ID ${COMPENSATION_CONFIG.retirementTransactionId}, ledger ${COMPENSATION_CONFIG.ledgerUrl}. Carbon Pocket is not certified or endorsed by Verra.`;
          painelParceiro.querySelector('[data-partner-cobenefits]').textContent = emPortugues
            ? 'As informações sobre cobenefícios são as publicadas pelo desenvolvedor do projeto.'
            : 'Co-benefit information is that published by the project developer.';
          painelParceiro.querySelector('[data-partner-roles]').textContent = emPortugues
            ? 'Verra é o padrão de certificação dos créditos. BR Carbon é o fornecedor de créditos.'
            : 'Verra is the certification standard for the credits. BR Carbon is the credit supplier.';
          painelParceiro.querySelector('[data-partner-link-label]').textContent = 'Link:';
        }
        const itens = emPortugues
          ? [
            `Emissões estimadas: dados informados por você e fatores IEA 2025 para eletricidade, DEFRA e EPA para transporte, ICAO para aviação, Diretrizes do IPCC para energia doméstica e Poore & Nemecek (2018) para alimentos. Lógica de escopos do GHG Protocol adaptada a indivíduos. É uma estimativa, não um inventário oficial.`,
            `Créditos: Verra VCS, REDD+ (evitação de desmatamento). Projeto: ${COMPENSATION_CONFIG.projectName}; ID VCS: ${COMPENSATION_CONFIG.projectId}; metodologia: ${COMPENSATION_CONFIG.methodologyId}; safras: ${COMPENSATION_CONFIG.vintageRange}.`,
            `Aposentadoria: um lote coletivo por ciclo; transação ${COMPENSATION_CONFIG.retirementTransactionId}; faixa de séries ${COMPENSATION_CONFIG.serialStart} a ${COMPENSATION_CONFIG.serialEnd}; data ${COMPENSATION_CONFIG.retirementDate}; beneficiário: contribuintes Carbon Pocket, ciclo ${COMPENSATION_CONFIG.beneficiaryCycle}.`,
            'Integridade: cada série é aposentada uma única vez e não pode ser revendida. O Carbon Pocket não reivindica os créditos para si. Os créditos não têm ajuste correspondente e não podem ser contabilizados por governos para suas NDCs.',
            'Status do padrão: Verra é o padrão de certificação dos créditos. Carbon Pocket não é certificado, endossado ou auditado pela Verra ou pela BR Carbon.',
          ]
          : [
            `Estimated emissions: based on your input, using IEA 2025 electricity factors, DEFRA and EPA transport factors, ICAO aviation data, IPCC Guidelines for household energy, and Poore & Nemecek (2018) for food. GHG Protocol scope logic adapted to individuals. This is an estimate, not an official inventory.`,
            `Credits: Verra VCS certified, REDD+ (avoided deforestation). Project: ${COMPENSATION_CONFIG.projectName}; VCS project ID: ${COMPENSATION_CONFIG.projectId}; methodology: ${COMPENSATION_CONFIG.methodologyId}; vintages: ${COMPENSATION_CONFIG.vintageRange}.`,
            `Retirement: one pooled retirement per cycle; transaction ${COMPENSATION_CONFIG.retirementTransactionId}; serial range ${COMPENSATION_CONFIG.serialStart} to ${COMPENSATION_CONFIG.serialEnd}; date ${COMPENSATION_CONFIG.retirementDate}; beneficiary: Carbon Pocket contributors, cycle ${COMPENSATION_CONFIG.beneficiaryCycle}.`,
            'Integrity: each serial is retired once and cannot be resold. Carbon Pocket makes no claim over the credits for its own account. The credits carry no corresponding adjustment, so governments cannot count them toward their NDCs.',
            'Standard status: Verra is the certification standard for the credits. Carbon Pocket is not certified, endorsed or audited by Verra or BR Carbon.',
          ];
        const lista = aviso.querySelector('[data-verification-list]');
        lista.replaceChildren(...itens.map((texto) => {
          const item = document.createElement('li');
          item.textContent = texto;
          return item;
        }));
      }

      function obterEmissaoAtual() {
        const elemento = document.querySelector('[data-testid="text-total"]');
        if (!elemento) return 0;
        return Number(String(elemento.textContent).replace(/[^\d.-]/g, '')) || 0;
      }

      function registrarPaisSelecionado() {
        const seletor = document.querySelector('[data-testid="select-country"]');
        if (!seletor) return;
        paisSelecionado = seletor.value;
        if (seletoresPaisRegistrados.has(seletor)) return;

        seletoresPaisRegistrados.add(seletor);
        seletor.addEventListener('change', () => {
          paisSelecionado = seletor.value;
          atualizarCheckout();
        });
      }

      function atualizarCheckout() {
        registrarPaisSelecionado();
        const emissaoKg = obterEmissaoAtual();
        if (document.querySelector('[data-testid="text-total"]')) {
          criarPainelCheckout();
          exibirValor(emissaoKg);
        } else {
          const rodape = document.querySelector('footer');
          const destino = rodape?.parentElement || document.getElementById('root');
          criarSeccaoCreditosAvulsos(destino, null);
        }
        atualizarConteudoPagina();
      }

      // Observa o resultado produzido pela calculadora React sem alterar seu calculo.
      const raizCalculadora = document.getElementById('root');
      const observadorCalculadora = new MutationObserver(() => {
        observadorCalculadora.disconnect();
        try {
          atualizarCheckout();
        } finally {
          observadorCalculadora.observe(raizCalculadora, {
            childList: true,
            characterData: true,
            subtree: true,
          });
        }
      });
      observadorCalculadora.observe(raizCalculadora, {
        childList: true,
        characterData: true,
        subtree: true,
      });
      atualizarCheckout();
    </script>
  </body>
</html>
