<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1713" />
    <title>Contribution confirmation | Carbon Pocket</title>
    <link rel="stylesheet" href="./assets/index-hQOtl3ms.css" />
    <link rel="stylesheet" href="./calculator-overrides.css" />
    <style>
      .receipt-language-bar {
        position: fixed;
        top: 16px;
        right: 20px;
        z-index: 1;
        width: auto;
        padding: 0;
        background: transparent;
      }

      .receipt-language-bar .lang-select {
        max-width: min(230px, calc(100vw - 40px));
      }

      .receipt-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
      }

      .receipt-actions[hidden] {
        display: none;
      }

      .receipt-print-hint {
        margin: 12px 0 0;
        color: #9fb0a2;
        font-size: 13px;
      }

      .receipt-project a {
        color: #72e19a;
      }

      .receipt-brand {
        display: block;
        width: 96px;
        height: 96px;
        margin: 0 auto 16px;
        border-radius: 20px;
        object-fit: cover;
      }

      #payment-details {
        margin: 24px auto;
        max-width: 500px;
      }

      #payment-details > div {
        display: grid;
        grid-template-columns: minmax(120px, 0.8fr) minmax(0, 1.4fr);
        align-items: baseline;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px solid rgba(234, 245, 233, 0.1);
        text-align: left;
      }

      #payment-details > div[hidden] {
        display: none;
      }

      #payment-details dt {
        color: #b9c8bc;
        font-weight: 500;
      }

      #payment-details dd {
        margin: 0;
        color: #a5f3c7;
        font-weight: 650;
        overflow-wrap: anywhere;
      }

      .receipt-project a {
        color: #a5f3c7;
        font-weight: 650;
      }

      .receipt-contributor {
        display: inline-flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
      }

      .receipt-plan-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 8px;
        border: 1px solid rgba(114, 225, 154, 0.3);
        border-radius: 999px;
        background: rgba(114, 225, 154, 0.1);
        color: #a5f3c7;
        font-size: 12px;
        font-weight: 650;
        line-height: 1.4;
      }

      .receipt-plan-badge svg {
        width: 14px;
        height: 14px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      @media (max-width: 480px) {
        #payment-details > div {
          grid-template-columns: minmax(105px, 0.8fr) minmax(0, 1.2fr);
          gap: 8px;
        }
      }

      @media print {
        @page {
          size: auto;
          margin: 12mm;
        }

        html,
        body {
          min-height: 0 !important;
          background: #0b1713 !important;
          print-color-adjust: exact;
          -webkit-print-color-adjust: exact;
        }

        .receipt-language-bar,
        .receipt-actions,
        #share-status,
        .receipt-print-hint {
          display: none !important;
        }

        .checkout-sucesso {
          min-height: 0 !important;
          display: block !important;
          padding: 0 !important;
        }

        .checkout-sucesso-card {
          width: 100% !important;
          max-width: 720px !important;
          margin: 36px auto !important;
          break-inside: avoid;
          box-shadow: none !important;
        }

        .receipt-brand {
          width: 82px;
          height: 82px;
        }
      }
    </style>
    <script src="./receipt-translations.js"></script>
  </head>
  <body>
    <div class="lang-bar receipt-language-bar">
      <select id="receipt-language" class="lang-select" aria-label="Select language">
        <option value="en">🇬🇧 English</option>
        <option value="pt">🇧🇷 Português</option>
        <option value="es">🇪🇸 Español</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="de">🇩🇪 Deutsch</option>
        <option value="it">🇮🇹 Italiano</option>
        <option value="ja">🇯🇵 日本語</option>
        <option value="ko">🇰🇷 한국어</option>
        <option value="zh">🇨🇳 中文</option>
        <option value="ru">🇷🇺 Русский</option>
        <option value="ar">🇸🇦 العربية</option>
        <option value="sv">🇸🇪 Svenska</option>
      </select>
    </div>
    <main class="checkout-sucesso">
      <section class="panel checkout-sucesso-card" aria-live="polite">
        <img
          class="receipt-brand"
          id="receipt-logo"
          src="./carbonpocket-logo.png"
          alt="Carbon Pocket"
        />
        <p class="result-kicker" id="payment-status">Payment status</p>
        <h1 id="payment-heading">Checking your payment</h1>
        <p id="payment-message">Verifying your payment...</p>
        <dl id="payment-details" hidden>
          <div id="payment-name-row" hidden><dt id="payment-name-label"></dt><dd class="receipt-contributor"><span id="payment-name"></span><span id="payment-plan-badge" class="receipt-plan-badge" hidden></span></dd></div>
          <div><dt id="payment-project-label"></dt><dd class="receipt-project"><a id="payment-project" href="https://brcarbon.com.br/brazilian-amazon/" target="_blank" rel="noopener noreferrer">Brazilian Amazon REDD+ APD</a></dd></div>
          <div><dt id="payment-quantity-label"></dt><dd id="payment-quantity"></dd></div>
          <div><dt id="payment-email-label"></dt><dd id="payment-email"></dd></div>
          <div><dt id="payment-code-label"></dt><dd id="payment-code"></dd></div>
        </dl>
        <div class="receipt-actions" id="receipt-actions" hidden>
          <button id="print-confirmation" class="button button-primary" type="button"></button>
          <button id="share-confirmation" class="button button-primary" type="button"></button>
        </div>
        <p class="receipt-print-hint" id="print-hint" hidden></p>
        <p id="share-status" role="status" aria-live="polite" hidden></p>
        <a
          id="calculator-link"
          class="button button-primary"
          href="https://carbonpocket.app/carbonpocket-calculator/"
          hidden
        ></a>
      </section>
    </main>
    <script>
      const CHECKOUT_API = 'https://carbonpocketapp.vercel.app/api/session';
      const sessionId = new URLSearchParams(window.location.search).get('session_id');
      const receiptTranslations = window.CARBONPOCKET_RECEIPT_TRANSLATIONS;
      const receiptLocales = {
        en: 'en-US', pt: 'pt-BR', es: 'es-ES', fr: 'fr-FR', de: 'de-DE',
        it: 'it-IT', ja: 'ja-JP', ko: 'ko-KR', zh: 'zh-CN', ru: 'ru-RU',
        ar: 'ar', sv: 'sv-SE',
      };
      const heading = document.getElementById('payment-heading');
      const message = document.getElementById('payment-message');
      const details = document.getElementById('payment-details');
      const actions = document.getElementById('receipt-actions');
      const printButton = document.getElementById('print-confirmation');
      const shareButton = document.getElementById('share-confirmation');
      const shareStatus = document.getElementById('share-status');
      const printHint = document.getElementById('print-hint');
      const calculatorLink = document.getElementById('calculator-link');
      const languageSelect = document.getElementById('receipt-language');
      let currentLanguage = 'en';
      let currentPayment = null;
      let paymentState = 'checking';

      function text(key) {
        return receiptTranslations[currentLanguage][key];
      }

      function contributorName(payment) {
        return typeof payment.nome === 'string' &&
          payment.nome.trim() &&
          payment.nome.trim().toLowerCase() !== 'anonymous'
          ? payment.nome.trim()
          : '';
      }

      function createPlanIcon(type) {
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('viewBox', '0 0 24 24');
        svg.setAttribute('aria-hidden', 'true');
        const paths = type === 'anual'
          ? ['M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9', 'M10 21h4']
          : ['M12 20v-8', 'M12 12c-5 0-8-3-8-8 5 0 8 3 8 8Z', 'M12 16c0-5 3-8 8-8 0 5-3 8-8 8Z'];
        for (const d of paths) {
          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('d', d);
          svg.appendChild(path);
        }
        return svg;
      }

      function applyLanguage() {
        const locale = receiptLocales[currentLanguage];
        document.documentElement.lang = currentLanguage;
        document.documentElement.dir = currentLanguage === 'ar' ? 'rtl' : 'ltr';
        document.title = text('pageTitle');
        languageSelect.setAttribute('aria-label', text('language'));
        document.getElementById('payment-status').textContent = text('status');
        document.getElementById('payment-name-label').textContent = text('contributor');
        document.getElementById('payment-project-label').textContent = text('project');
        document.getElementById('payment-quantity-label').textContent = text('volume');
        document.getElementById('payment-email-label').textContent = text('email');
        document.getElementById('payment-code-label').textContent = text('code');
        printButton.textContent = text('printPdf');
        shareButton.textContent = text('shareImage');
        printHint.textContent = text('printHint');
        calculatorLink.textContent = text('back');

        if (paymentState === 'checking') {
          heading.textContent = text('checking');
          message.textContent = text('verifying');
        } else if (paymentState === 'completed' && currentPayment) {
          heading.textContent = text('completed');
          message.textContent = text('completedMessage');
          renderPaymentDetails(currentPayment, locale);
        } else if (paymentState === 'processing') {
          heading.textContent = text('processing');
          message.textContent = text('processingMessage');
        } else {
          heading.textContent = text('error');
          message.textContent = text('errorMessage');
        }
      }

      function renderPaymentDetails(payment, locale) {
        const name = contributorName(payment);
        document.getElementById('payment-name').textContent = name;
        document.getElementById('payment-name-row').hidden = !name;
        const planBadge = document.getElementById('payment-plan-badge');
        const planType = payment.categoria === 'mensal' || payment.categoria === 'anual'
          ? payment.categoria
          : null;
        planBadge.hidden = !planType;
        planBadge.replaceChildren();
        if (planType) {
          planBadge.append(
            createPlanIcon(planType),
            document.createTextNode(text(planType === 'anual' ? 'foundersBadge' : 'starterBadge')),
          );
        }
        const rawKg = payment.emissao_kg ?? payment.quantity;
        const kg = Number(rawKg);
        document.getElementById('payment-quantity').textContent =
          Number.isFinite(kg) && kg >= 0
            ? `${new Intl.NumberFormat(locale).format(kg)} kg CO₂e`
            : '—';
        document.getElementById('payment-email').textContent =
          payment.customer_email ?? text('unavailable');
        document.getElementById('payment-code').textContent =
          payment.database_code ?? text('codePending');
        details.hidden = false;
        actions.hidden = false;
        printHint.hidden = false;
      }

      async function createConfirmationImage(payment) {
        const canvas = document.createElement('canvas');
        canvas.width = 1200;
        canvas.height = 675;
        const context = canvas.getContext('2d');
        if (!context) throw new Error('Image canvas is unavailable');

        const background = context.createLinearGradient(0, 0, 1200, 675);
        background.addColorStop(0, '#0b1713');
        background.addColorStop(1, '#173326');
        context.fillStyle = background;
        context.fillRect(0, 0, canvas.width, canvas.height);

        context.fillStyle = 'rgba(22, 44, 33, 0.92)';
        context.beginPath();
        context.roundRect(56, 48, 1088, 579, 28);
        context.fill();
        context.strokeStyle = 'rgba(234, 245, 233, 0.16)';
        context.lineWidth = 2;
        context.stroke();

        const logo = document.getElementById('receipt-logo');
        if (!logo.complete) {
          await new Promise((resolve, reject) => {
            logo.addEventListener('load', resolve, { once: true });
            logo.addEventListener('error', reject, { once: true });
          });
        }
        context.drawImage(logo, 92, 72, 128, 128);

        const name = contributorName(payment);
        const locale = receiptLocales[currentLanguage];
        const rawKg = payment.emissao_kg ?? payment.quantity;
        const kg = Number(rawKg);
        const volume = Number.isFinite(kg) && kg >= 0
          ? `${new Intl.NumberFormat(locale).format(kg)} kg CO₂e`
          : '—';

        context.fillStyle = '#eaf5e9';
        context.font = '700 48px Inter, system-ui, sans-serif';
        context.fillText(text('imageTitle'), 260, 148, 820);

        let nextLine = 280;
        const drawReceiptRow = (label, value) => {
          context.fillStyle = '#b9c8bc';
          context.font = '500 24px Inter, system-ui, sans-serif';
          context.fillText(`${label}:`, 104, nextLine, 330);
          context.fillStyle = '#a5f3c7';
          context.font = '650 26px Inter, system-ui, sans-serif';
          context.fillText(value, 390, nextLine, 700);
          nextLine += 58;
        };
        if (name) {
          drawReceiptRow(text('contributor'), name.slice(0, 48));
          const planType = payment.categoria === 'mensal' || payment.categoria === 'anual'
            ? payment.categoria
            : null;
          if (planType) {
            const badgeText = `${planType === 'anual' ? '🔔' : '🌱'} ${text(planType === 'anual' ? 'foundersBadge' : 'starterBadge')}`;
            context.font = '650 19px Inter, system-ui, sans-serif';
            const badgeWidth = context.measureText(badgeText).width + 26;
            const badgeX = Math.min(1200 - badgeWidth - 100, 390 + context.measureText(name.slice(0, 48)).width + 16);
            const badgeY = nextLine - 41;
            context.fillStyle = 'rgba(114, 225, 154, 0.12)';
            context.beginPath();
            context.roundRect(badgeX, badgeY, badgeWidth, 34, 17);
            context.fill();
            context.strokeStyle = 'rgba(114, 225, 154, 0.35)';
            context.stroke();
            context.fillStyle = '#a5f3c7';
            context.fillText(badgeText, badgeX + 13, badgeY + 23, badgeWidth - 20);
          }
        }
        drawReceiptRow(text('project'), 'Brazilian Amazon REDD+ APD');
        drawReceiptRow(text('volume'), volume);
        if (payment.database_code) {
          drawReceiptRow(text('code'), payment.database_code);
        }

        context.fillStyle = '#b9c8bc';
        context.font = '400 21px Inter, system-ui, sans-serif';
        context.fillText(text('imageEmissions'), 104, 554, 980);
        context.fillText(
          `${text('imageCredits')} carbonpocket.app`,
          104,
          596,
          980,
        );
        return new Promise((resolve, reject) => {
          canvas.toBlob((blob) => {
            if (blob) resolve(blob);
            else reject(new Error('Could not generate the confirmation image'));
          }, 'image/png');
        });
      }

      async function shareConfirmation() {
        shareButton.disabled = true;
        shareStatus.hidden = true;
        try {
          const blob = await createConfirmationImage(currentPayment);
          const file = new File([blob], 'carbon-pocket-confirmation.png', {
            type: 'image/png',
          });
          if (navigator.canShare?.({ files: [file] }) && navigator.share) {
            await navigator.share({
              files: [file],
              title: text('shareTitle'),
              text: text('shareText'),
            });
          } else {
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = file.name;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            shareStatus.textContent = text('shareReady');
            shareStatus.hidden = false;
          }
        } catch (error) {
          if (error.name !== 'AbortError') {
            shareStatus.textContent = text('shareError');
            shareStatus.hidden = false;
          }
        } finally {
          shareButton.disabled = false;
        }
      }

      function showVerificationError() {
        paymentState = 'error';
        applyLanguage();
        calculatorLink.hidden = false;
      }

      languageSelect.addEventListener('change', () => {
        currentLanguage = receiptTranslations[languageSelect.value]
          ? languageSelect.value
          : 'en';
        try {
          localStorage.setItem('carbonpocket-lang', currentLanguage);
        } catch {
          // Language selection remains available for the current page view.
        }
        shareStatus.hidden = true;
        applyLanguage();
      });

      printButton.addEventListener('click', () => window.print());
      shareButton.addEventListener('click', shareConfirmation);

      try {
        const savedLanguage = localStorage.getItem('carbonpocket-lang');
        if (receiptTranslations[savedLanguage]) currentLanguage = savedLanguage;
      } catch {
        // Use English when browser storage is unavailable.
      }
      languageSelect.value = currentLanguage;
      applyLanguage();

      async function verifyPayment() {
        if (!sessionId || !sessionId.startsWith('cs_') || sessionId.length < 10 || sessionId.length > 255) {
          showVerificationError();
          return;
        }

        try {
          let payment;
          for (let attempt = 0; attempt < 5; attempt += 1) {
            const response = await fetch(
              `${CHECKOUT_API}?session_id=${encodeURIComponent(sessionId)}`,
            );
            if (!response.ok) throw new Error('Payment lookup failed');
            payment = await response.json();
            if (
              payment.payment_status !== 'paid' &&
              payment.payment_status !== 'no_payment_required'
            ) {
              break;
            }
            if (payment.database_code || attempt === 4) break;
            await new Promise((resolve) => setTimeout(resolve, 800));
          }

          if (
            payment.payment_status === 'paid' ||
            payment.payment_status === 'no_payment_required'
          ) {
            currentPayment = payment;
            paymentState = 'completed';
            applyLanguage();
          } else if (payment.payment_status === 'unpaid') {
            paymentState = 'processing';
            applyLanguage();
          } else {
            showVerificationError();
          }
        } catch {
          showVerificationError();
        }
      }

      verifyPayment();
    </script>
  </body>
</html>
