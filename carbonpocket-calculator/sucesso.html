<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contribution confirmation | Carbon Pocket</title>
    <link rel="stylesheet" href="./assets/index-hQOtl3ms.css" />
    <link rel="stylesheet" href="./calculator-overrides.css" />
  </head>
  <body>
    <main class="checkout-sucesso">
      <section class="panel checkout-sucesso-card" aria-live="polite">
        <p class="result-kicker">Payment status</p>
        <h1 id="payment-heading">Checking your payment</h1>
        <p id="payment-message">Verifying your payment...</p>
        <dl id="payment-details" hidden>
          <div id="payment-name-row" hidden><dt>Contributor</dt><dd id="payment-name"></dd></div>
          <div><dt>Compensated volume</dt><dd id="payment-quantity"></dd></div>
          <div><dt>Amount paid</dt><dd id="payment-amount"></dd></div>
          <div><dt>Email</dt><dd id="payment-email"></dd></div>
          <div><dt>Database record code</dt><dd id="payment-code"></dd></div>
        </dl>
        <button id="download-confirmation" class="button button-primary" type="button" hidden>
          Download confirmation
        </button>
        <button id="share-confirmation" class="button button-primary" type="button" hidden>
          Share confirmation image
        </button>
        <p id="share-status" role="status" aria-live="polite" hidden></p>
        <a
          id="calculator-link"
          class="button button-primary"
          href="https://carbonpocket.app/carbonpocket-calculator/"
          hidden
        >
          Back to calculator
        </a>
      </section>
    </main>
    <script>
      const CHECKOUT_API = 'https://carbonpocketapp.vercel.app/api/session';
      const sessionId = new URLSearchParams(window.location.search).get('session_id');
      const heading = document.getElementById('payment-heading');
      const message = document.getElementById('payment-message');
      const details = document.getElementById('payment-details');
      const downloadButton = document.getElementById('download-confirmation');
      const shareButton = document.getElementById('share-confirmation');
      const shareStatus = document.getElementById('share-status');
      const calculatorLink = document.getElementById('calculator-link');

      function formatPaymentAmount(payment) {
        if (
          !Number.isSafeInteger(payment.amount_total) ||
          typeof payment.currency !== 'string' ||
          !/^[a-z]{3}$/i.test(payment.currency)
        ) {
          return 'Amount unavailable';
        }

        const currency = payment.currency.toUpperCase();
        const fractionDigits = new Intl.NumberFormat('en-US', {
          style: 'currency',
          currency,
        }).resolvedOptions().maximumFractionDigits;
        const amount = new Intl.NumberFormat('en-US', {
          minimumFractionDigits: fractionDigits,
          maximumFractionDigits: fractionDigits,
        }).format(payment.amount_total / (10 ** fractionDigits));
        return `${currency} ${amount}`;
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (character) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;',
        })[character]);
      }

      function downloadConfirmation(payment) {
        const issuedOn = new Date().toISOString().slice(0, 10);
        const kg = Number(payment.emissao_kg);
        const hasKg = payment.emissao_kg !== null &&
          payment.emissao_kg !== undefined &&
          String(payment.emissao_kg).trim() !== '';
        const compensatedKg = hasKg && Number.isFinite(kg) && kg >= 0
          ? `${new Intl.NumberFormat('en-US').format(kg)} kg CO₂e`
          : 'Not available';
        const contributorName = typeof payment.nome === 'string' && payment.nome.trim()
          ? payment.nome.trim()
          : 'Not provided';
        const amount = formatPaymentAmount(payment);
        const confirmation = `<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contribution confirmation | Carbon Pocket</title>
</head>
<body>
  <main>
    <h1>Contribution confirmation</h1>
    <p><strong>Carbon Pocket</strong></p>
    <dl>
      <dt>Issue date</dt><dd>${escapeHtml(issuedOn)}</dd>
      <dt>Contributor name</dt><dd>${escapeHtml(contributorName)}</dd>
      <dt>Database record code</dt><dd>${escapeHtml(payment.database_code || 'Not available yet')}</dd>
      <dt>Compensated volume</dt><dd>${escapeHtml(compensatedKg)}</dd>
      <dt>Amount paid</dt><dd>${escapeHtml(amount)}</dd>
      <dt>Transaction reference</dt><dd>${escapeHtml(sessionId)}</dd>
    </dl>
    <p>This document records a contribution made through Carbon Pocket. It is not a certificate, not a proof of neutralization, not carbon neutral, not net zero, not an official inventory, not a CRVE, and not valid for SBCE compliance or NDC claims. Compensation, not reduction: emissions still occur. Credits are retired in aggregate with other contributors.</p>
    <p><a href="https://carbonpocket.app/carbonpocket-calculator/contributors.html">View contributors</a></p>
  </main>
</body>
</html>`;
        const blob = new Blob([confirmation], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `carbon-pocket-confirmation-${sessionId.replace(/[^A-Za-z0-9_-]/g, '_')}.html`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function roundedRect(context, x, y, width, height, radius) {
        context.beginPath();
        context.roundRect(x, y, width, height, radius);
      }

      function createConfirmationImage(payment) {
        const canvas = document.createElement('canvas');
        canvas.width = 1200;
        canvas.height = 675;
        const context = canvas.getContext('2d');
        if (!context) throw new Error('Image canvas is unavailable');

        const background = context.createLinearGradient(0, 0, 1200, 675);
        background.addColorStop(0, '#0b1713');
        background.addColorStop(1, '#173326');
        context.fillStyle = background;
        context.fillRect(0, 0, canvas.width, canvas.height);

        context.fillStyle = 'rgba(22, 44, 33, 0.92)';
        roundedRect(context, 56, 48, 1088, 579, 28);
        context.fill();
        context.strokeStyle = 'rgba(234, 245, 233, 0.16)';
        context.lineWidth = 2;
        context.stroke();

        context.fillStyle = '#72e19a';
        context.font = '700 25px Inter, system-ui, sans-serif';
        context.fillText('CARBON POCKET', 104, 116);

        context.fillStyle = '#eaf5e9';
        context.font = '700 52px Inter, system-ui, sans-serif';
        context.fillText('Contribution confirmed', 104, 198);

        const name = typeof payment.nome === 'string' &&
          payment.nome.trim() &&
          payment.nome.trim().toLowerCase() !== 'anonymous'
          ? payment.nome.trim()
          : '';
        if (name) {
          context.fillStyle = '#b9c8bc';
          context.font = '400 28px Inter, system-ui, sans-serif';
          context.fillText(`Contributor: ${name.slice(0, 48)}`, 104, 252);
        }

        const rawKg = payment.emissao_kg ?? payment.quantity;
        const kg = Number(rawKg);
        const volume = Number.isFinite(kg) && kg >= 0
          ? `${new Intl.NumberFormat('en-US').format(kg)} kg CO₂e`
          : 'Volume unavailable';
        context.fillStyle = '#72e19a';
        context.font = '700 76px Inter, system-ui, sans-serif';
        context.fillText(volume, 104, name ? 376 : 334);
        context.fillStyle = '#b9c8bc';
        context.font = '400 25px Inter, system-ui, sans-serif';
        context.fillText('Contribution intended for emissions compensation', 104, name ? 426 : 384);

        if (payment.database_code) {
          context.fillStyle = '#eaf5e9';
          context.font = '600 23px Inter, system-ui, sans-serif';
          context.fillText(`Record code: ${payment.database_code}`, 104, name ? 484 : 442);
        }

        context.fillStyle = '#9fb0a2';
        context.font = '400 20px Inter, system-ui, sans-serif';
        context.fillText('Compensation is not emissions reduction; emissions still occur.', 104, 562);
        context.fillText('Credits are retired in aggregate. carbonpocket.app', 104, 596);
        return new Promise((resolve, reject) => {
          canvas.toBlob((blob) => {
            if (blob) resolve(blob);
            else reject(new Error('Could not generate the confirmation image'));
          }, 'image/png');
        });
      }

      async function shareConfirmation(payment) {
        shareButton.disabled = true;
        shareStatus.hidden = true;
        try {
          const blob = await createConfirmationImage(payment);
          const file = new File([blob], 'carbon-pocket-confirmation.png', {
            type: 'image/png',
          });
          if (navigator.canShare?.({ files: [file] }) && navigator.share) {
            await navigator.share({
              files: [file],
              title: 'Carbon Pocket contribution confirmation',
              text: 'My contribution is intended for emissions compensation. Emissions still occur.',
            });
          } else {
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = file.name;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            shareStatus.textContent =
              'Image downloaded. You can now share it on your preferred social network.';
            shareStatus.hidden = false;
          }
        } catch (error) {
          if (error.name !== 'AbortError') {
            shareStatus.textContent = 'Could not create or share the image. Please try again.';
            shareStatus.hidden = false;
          }
        } finally {
          shareButton.disabled = false;
        }
      }

      function showVerificationError() {
        heading.textContent = 'Payment could not be verified';
        message.textContent = 'We could not verify this payment. Please check the link you received.';
        calculatorLink.hidden = false;
      }

      async function verifyPayment() {
        if (!sessionId || !sessionId.startsWith('cs_') || sessionId.length < 10 || sessionId.length > 255) {
          showVerificationError();
          return;
        }

        try {
          let payment;
          for (let attempt = 0; attempt < 5; attempt += 1) {
            const response = await fetch(
              `${CHECKOUT_API}?session_id=${encodeURIComponent(sessionId)}`,
            );
            if (!response.ok) throw new Error('Payment lookup failed');
            payment = await response.json();
            if (
              payment.payment_status !== 'paid' &&
              payment.payment_status !== 'no_payment_required'
            ) {
              break;
            }
            if (payment.database_code || attempt === 4) break;
            await new Promise((resolve) => setTimeout(resolve, 800));
          }

          if (
            payment.payment_status === 'paid' ||
            payment.payment_status === 'no_payment_required'
          ) {
            heading.textContent = 'Contribution completed';
            message.textContent =
              'Your compensation purchase has been confirmed. Your emissions still occur.';
            const contributorName = typeof payment.nome === 'string' &&
              payment.nome.trim() &&
              payment.nome.trim().toLowerCase() !== 'anonymous'
              ? payment.nome.trim()
              : '';
            if (contributorName) {
              document.getElementById('payment-name').textContent = contributorName;
              document.getElementById('payment-name-row').hidden = false;
            }
            document.getElementById('payment-quantity').textContent =
              `${payment.emissao_kg ?? payment.quantity ?? '—'} kg CO₂e`;
            document.getElementById('payment-amount').textContent =
              formatPaymentAmount(payment);
            document.getElementById('payment-email').textContent =
              payment.customer_email ?? 'Email unavailable';
            document.getElementById('payment-code').textContent =
              payment.database_code ?? 'Being generated';
            details.hidden = false;
            downloadButton.hidden = false;
            shareButton.hidden = false;
            downloadButton.addEventListener('click', () => downloadConfirmation(payment));
            shareButton.addEventListener('click', () => shareConfirmation(payment));
          } else if (payment.payment_status === 'unpaid') {
            heading.textContent = 'Payment processing';
            message.textContent =
              'Your payment is being processed. You will receive confirmation shortly.';
          } else {
            showVerificationError();
          }
        } catch {
          showVerificationError();
        }
      }

      verifyPayment();
    </script>
  </body>
</html>
